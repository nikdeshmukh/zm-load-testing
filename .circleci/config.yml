version: 2.1

jobs:
  # Runs performance test on baseline build
  perf_test_baseline:
    docker:
      - image: circleci/openjdk:8-jdk
    steps:
      - checkout

      # Install SSH client
      - run:
          name: Install SSH client
          command: sudo apt-get update && sudo apt-get install -y openssh-client

      # Set up SSH key
      - add_ssh_keys:
          fingerprints:
            - "SHA256:Afc6ZY8tntqqdMKQRPjUfe1blywjlQaaRZv9xN95eW8"

      # Create the results directory
      - run:
          name: Create Results Directory
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "mkdir -p /tmp/result"

      # Connect to remote server and run JMeter test
      - run:
          name: Run JMeter test on remote server
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; sh regression_load_test_run.sh"
          no_output_timeout: 1h
          timeout: 1h

      - run:
          name: Generate CSV file from jtl file
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER}
            "cd /home/opc/zm-load-testing; sh jtl_to_csv_converter_B1.sh"

 # Runs performance tests on current build
  perf_test_benchmark:
    docker:
      - image: circleci/openjdk:8-jdk
    steps:
      - checkout

      # Install SSH client
      - run:
          name: Install SSH client
          command: sudo apt-get update && sudo apt-get install -y openssh-client

      # Set up SSH key
      - add_ssh_keys:
          fingerprints:
            - "SHA256:Afc6ZY8tntqqdMKQRPjUfe1blywjlQaaRZv9xN95eW8"

      # Create the results directory
      - run:
          name: Create Results Directory
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "mkdir -p /tmp/result"

      # Connect to remote server and run JMeter test
      - run:
          name: Run JMeter test on remote server
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; sh regression_load_test_run.sh"
          no_output_timeout: 2h
          timeout: 2h

      - run:
          name: Generate CSV file from jtl file
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER}
            "cd /home/opc/zm-load-testing; sh jtl_to_csv_converter_B2.sh"

  # Run response time comparison across builds and create comparison report for SOAP
      - run:
          name: Run response time comparison for SOAP
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; python3 compare_resp_time_zsoap.py"

      # Run response time comparison across builds and create comparison report for IMAP
      - run:
          name: Run response time comparison for IMAP
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; python3 compare_resp_time_imap.py"

      # Run response time comparison across builds and create comparison report for POP
      - run:
          name: Run response time comparison for POP
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; python3 compare_resp_time_pop.py"

      # Run response time comparison across builds and create comparison report for LMTP
      - run:
          name: Run response time comparison for LMTP
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; python3 compare_resp_time_lmtp.py"

      # Run response time comparison across builds and create comparison report for ActiveSync
      - run:
          name: Run response time comparison for ActiveSync
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "cd /home/opc/zm-load-testing; python3 compare_resp_time_eas.py"

      # Copy test artifacts to the results directory
      - run:
          name: Copy Test files to Artifacts
          command: |
            scp -r ${USER}@${SERVER}:/tmp/results /tmp/result

      # Create HTML Results Directory
      - run:
          name: Create HTML Results Directory
          command: |
            ssh -o StrictHostKeyChecking=no ${USER}@${SERVER} "mkdir -p /tmp/result/html_report"

      # Copy Test Artifacts
      - run:
          name: Copy Test Artifacts
          command: |
            scp -r ${USER}@${SERVER}:/tmp/result /tmp/result

      # Store artifacts in CircleCI
      - store_artifacts:
          path: /tmp/result          
          
# Define workflows with approval steps
workflows:
  version: 2
  perf_test_workflow:
    jobs:
      - perf_test_baseline:
          filters:
            branches:
              only: circleci-editor/504/circleci-project-setup  # You can adjust the filter as needed
      - perf_test_baseline_approval:
          type: approval  # Approval step for beseline test
          requires:
            - perf_test_baseline
      - perf_test_benchmark:
          filters:
            branches:
              only: circleci-editor/504/circleci-project-setup  # You can adjust the filter as needed
          requires:
            - perf_test_baseline_approval  # Make sure benchmark runs after approval_1
      - perf_test_benchmark_approval:
          type: approval  # Approval step for benchmark test
          requires:
            - perf_test_benchmark